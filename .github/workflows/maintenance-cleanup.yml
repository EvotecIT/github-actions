name: Evotec Actions Storage Cleanup (Core)

on:
  workflow_call:
    inputs:
      days:
        description: 'Delete items older than N days'
        required: false
        default: '7'
        type: string
      keep_artifacts:
        description: 'Keep newest N artifacts'
        required: false
        default: '20'
        type: string
      keep_caches:
        description: 'Keep newest N caches'
        required: false
        default: '20'
        type: string
      apply:
        description: 'Apply deletions (true/false)'
        required: false
        default: 'true'
        type: string
      runs_on:
        description: 'JSON array of runner labels'
        required: false
        default: '["ubuntu-latest"]'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PSPublishModule
        uses: actions/checkout@v4
        with:
          repository: EvotecIT/PSPublishModule
          ref: aeafc6ee579a474a14e9f6542ffbd1a2eb81e615
          path: .powerforge/pspublishmodule

      - name: Generate housekeeping config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not [int]::TryParse('${{ inputs.days }}', [ref]$days)) {
            throw "Input 'days' must be an integer. Received: '${{ inputs.days }}'"
          }
          if (-not [int]::TryParse('${{ inputs.keep_artifacts }}', [ref]$keepArtifacts)) {
            throw "Input 'keep_artifacts' must be an integer. Received: '${{ inputs.keep_artifacts }}'"
          }
          if (-not [int]::TryParse('${{ inputs.keep_caches }}', [ref]$keepCaches)) {
            throw "Input 'keep_caches' must be an integer. Received: '${{ inputs.keep_caches }}'"
          }

          $configPath = Join-Path $env:GITHUB_WORKSPACE '.powerforge/_generated/github-housekeeping.json'
          $config = [ordered]@{
            '$schema' = 'https://raw.githubusercontent.com/EvotecIT/PSPublishModule/main/Schemas/github.housekeeping.schema.json'
            repository = $env:GITHUB_REPOSITORY
            tokenEnvName = 'GITHUB_TOKEN'
            artifacts = [ordered]@{
              enabled = $true
              keepLatestPerName = $keepArtifacts
              maxAgeDays = $days
              maxDelete = 1000
            }
            caches = [ordered]@{
              enabled = $true
              keepLatestPerKey = $keepCaches
              maxAgeDays = $days
              maxDelete = 1000
            }
            runner = [ordered]@{
              enabled = $false
            }
          }

          $directory = Split-Path -Parent $configPath
          if (-not [string]::IsNullOrWhiteSpace($directory)) {
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
          }

          $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $configPath -Encoding utf8

      - name: Show settings
        shell: pwsh
        run: |
          Write-Host "Days threshold: ${{ inputs.days }}"
          Write-Host "Keep newest artifacts: ${{ inputs.keep_artifacts }}"
          Write-Host "Keep newest caches: ${{ inputs.keep_caches }}"
          Write-Host "Apply deletions: ${{ inputs.apply }}"

      - name: Run PowerForge housekeeping
        id: housekeeping
        uses: ./.powerforge/pspublishmodule/.github/actions/github-housekeeping
        with:
          config-path: ./.powerforge/_generated/github-housekeeping.json
          apply: ${{ inputs.apply }}
          report-path: ./.powerforge/_reports/github-housekeeping.json
          summary-path: ./.powerforge/_reports/github-housekeeping.md

      - name: Upload housekeeping reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evotec-actions-storage-cleanup-reports
          path: |
            ${{ steps.housekeeping.outputs.report-path }}
            ${{ steps.housekeeping.outputs.summary-path }}
          if-no-files-found: ignore
